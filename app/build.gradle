apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'
apply plugin: 'io.objectbox'
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.gitlab.mudlej.MjPdfReader'
    compileSdk 36

    defaultConfig {
        applicationId "com.bumbumapps.pdfandepubreader"
        minSdk 24 // play-services-ads 25 requires 24
        targetSdk 36
        versionCode 6
        versionName "1.1.0"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        viewBinding true
        buildConfig true
        resValues true
    }

    buildTypes {
        debug {
            debuggable true
            // Google sample IDs: debug builds never request live ads.
            manifestPlaceholders = [admobAppId: "ca-app-pub-3940256099942544~3347511713"]
            resValue "string", "admob_banner_id", "ca-app-pub-3940256099942544/9214589741"
            resValue "string", "admob_interstitial_id", "ca-app-pub-3940256099942544/1033173712"
        }
        release {
            manifestPlaceholders = [admobAppId: "ca-app-pub-8444865753152507~2009558657"]
            resValue "string", "admob_banner_id", "ca-app-pub-8444865753152507/7253899057"
            resValue "string", "admob_interstitial_id", "ca-app-pub-8444865753152507/6012969574"
            debuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += ['META-INF/ASL2.0', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE',
                         'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/LGPL2.1']
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.5'

    implementation 'androidx.room:room-runtime:2.7.2'
    kapt 'androidx.room:room-compiler:2.7.2'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.material:material:1.13.0'

    implementation 'com.github.paolorotolo:appintro:v5.1.0'

    implementation project(':AndroidPdfViewer:android-pdf-viewer')
    implementation project(':folioreader')
    implementation 'com.github.franmontiel:AttributionPresenter:1.0.1'

    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    implementation 'com.github.duanhong169:colorpicker:1.1.6'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'

    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'
    implementation 'com.itextpdf:itextg:5.5.10'
    // iText needs (Spongy)Castle to decrypt password-protected PDFs.
    implementation 'com.madgag.spongycastle:core:1.58.0.0'
    implementation 'com.madgag.spongycastle:prov:1.58.0.0'

    testImplementation 'junit:junit:4.13.2'
}
