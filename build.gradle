buildscript {
    ext.kotlin_version = '2.2.21'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.5.0'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.8'
        classpath 'io.objectbox:objectbox-gradle-plugin:5.4.2'
    }
}

apply from: "versions.gradle"

allprojects {
    // r2-streamer pins a NanoHttpd jitpack snapshot (org.nanohttpd packages) that jitpack can no longer
    // build; the same sources are vendored in :nanohttpd.
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('com.github.NanoHttpd.nanohttpd:nanohttpd') using project(':nanohttpd')
            substitute module('com.github.NanoHttpd.nanohttpd:nanohttpd-nanolets') using project(':nanohttpd')
            // jcenter-only; same package (com.google.android.flexbox) in the maintained artifact.
            substitute module('com.google.android:flexbox') using module('com.google.android.flexbox:flexbox:3.0.0')
        }
        // r2-shared declares Fuel (jcenter-only) but none of its classes use it.
        exclude group: 'com.github.kittinunf.fuel'
    }
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://jitpack.io"
            content { includeGroupByRegex 'com\\.github\\..*' }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
